# covers: [src/**]
# verified_at: none
# owner: architect
# Components and systems. Systems list what they read and write so the architect can
# detect ordering conflicts and parallel-safe tickets.

components:
  Position: { fields: { x: f32, y: f32 } }
  Velocity: { fields: { x: f32, y: f32 } }
  Health:   { fields: { current: i32, max: i32 } }

systems:
  - name: movement
    stage: fixed_update
    reads: [Velocity]
    writes: [Position]
    after: [input_to_velocity]
  - name: damage
    stage: fixed_update
    reads: [Position]
    writes: [Health]
    after: [movement]

events:
  - name: Died
    emitted_by: damage
    consumed_by: [score, despawn]
