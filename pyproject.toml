[project]
name = "habits"
version = "0.1.0"
description = "Single-user habit tracker HTTP API (FastAPI + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habits"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["scripts/agent", "work", ".worktrees", "docs"]

[tool.ruff.lint.isort]
known-first-party = ["habits", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "migrations"]
exclude = ["scripts", "work", ".worktrees", ".venv"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
